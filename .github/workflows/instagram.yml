name: Instagram-Posts

on:
  schedule:
    # Montag 9:00 und Freitag 12:00 deutscher Zeit – je zwei UTC-Zeiten wegen Sommer-/Winterzeit
    - cron: "5 7,8 * * 1"
    - cron: "5 10,11 * * 5"
    # Story „Heute live“ täglich 8:00 deutscher Zeit (nur an Renntagen)
    - cron: "5 6,7 * * *"
    # Token-Verlängerung jeden Mittwoch
    - cron: "17 4 * * 3"
  push:
    paths: ["insta/test.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "week, weekend oder story (leer = nach Zeitplan)"
        required: false
        default: ""
      publish:
        description: "Wirklich auf Instagram posten? (false = nur Bilder erzeugen)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency: instagram

jobs:
  post:
    if: github.event.schedule != '17 4 * * 3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Zeitplan prüfen
        id: gate
        env:
          FORCE_MODE: ${{ github.event.inputs.mode }}
          FORCE_PUBLISH: ${{ github.event.inputs.publish }}
          EVENT: ${{ github.event_name }}
        run: python3 insta/gate.py >> "$GITHUB_OUTPUT"
      - name: Werkzeuge installieren
        if: steps.gate.outputs.mode != 'none' && steps.gate.outputs.mode != 'existing'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter fonts-noto-color-emoji ffmpeg
          pip install -q playwright && python3 -m playwright install --with-deps chromium
      - name: Bilder erzeugen
        if: steps.gate.outputs.mode != 'none' && steps.gate.outputs.mode != 'existing'
        run: python3 insta/make_post.py ${{ steps.gate.outputs.mode }} ${{ steps.gate.outputs.date }} --out ${{ steps.gate.outputs.out }}
      - name: Bilder ins Repo (öffentliche URL für Instagram)
        if: steps.gate.outputs.mode != 'none'
        run: |
          git config user.name "Florian Lang"
          git config user.email "langflo163@users.noreply.github.com"
          git add -A posts insta/state.json 2>/dev/null || true
          git commit -m "Instagram ${{ steps.gate.outputs.mode }} ${{ steps.gate.outputs.date }}" || true
          git pull --rebase -q && git push -q
      - name: Auf Instagram veröffentlichen
        if: steps.gate.outputs.mode != 'none' && steps.gate.outputs.publish == 'true' && hashFiles(format('{0}/*', steps.gate.outputs.out)) != ''
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 insta/post.py ${{ steps.gate.outputs.out }}

  refresh-token:
    if: github.event.schedule == '17 4 * * 3'
    runs-on: ubuntu-latest
    steps:
      - name: Instagram-Token verlängern
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, subprocess, sys
          tok = os.environ["IG_TOKEN"]
          url = "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=" + tok
          try:
              r = json.load(urllib.request.urlopen(url, timeout=60))
          except Exception as e:
              sys.exit("Verlängerung fehlgeschlagen: " + str(e).replace(tok, "***"))
          new = r.get("access_token", "")
          days = int(r.get("expires_in", 0)) // 86400
          print(f"Token verlängert, gültig noch ca. {days} Tage.")
          if new and new != tok:
              if os.environ.get("GH_PAT"):
                  subprocess.run(["gh", "secret", "set", "IG_TOKEN", "--repo", os.environ["GH_REPO"], "--body", new],
                                 check=True, env={**os.environ, "GH_TOKEN": os.environ["GH_PAT"]})
                  print("Neuer Token als Secret IG_TOKEN gespeichert.")
              else:
                  sys.exit("Neuer Token erhalten, aber kein GH_PAT-Secret zum Speichern vorhanden.")
          PY
