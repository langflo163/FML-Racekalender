name: Facebook-Testpost

# Postet einen vorhandenen Ordner aus posts/ NUR auf Facebook. Auslösen: insta/fb_test.json {"folder": "posts/…"} pushen.
on:
  push:
    paths: ["insta/fb_test.json"]

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auf Facebook posten
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python3 insta/fb_post.py "$(python3 -c "import json;print(json.load(open('insta/fb_test.json'))['folder'])")"
