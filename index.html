<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FML Rennkalender</title>
<meta name="description" content="Motorsport-Termine mit deutscher Zeit und deutscher Übertragung">
<meta name="theme-color" content="#d71920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rennkalender">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#14171c; --muted:#646b76; --line:#e2e5ea;
  --accent:#e10600; --mine:#127a3d; --mine-bg:#e3f4ea; --free:#1d5fbf; --free-bg:#e5eefb;
  --pay:#6b7280; --pay-bg:#eef0f3; --open:#a05a00; --hl:#ffb400;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1114; --card:#181b20; --text:#eef0f3; --muted:#9aa2ad; --line:#2a2f37;
    --mine:#5fd38f; --mine-bg:#173326; --free:#7fb0ff; --free-bg:#1a2740;
    --pay:#a3a9b3; --pay-bg:#23272e; --open:#f0a54a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1114; --card:#181b20; --text:#eef0f3; --muted:#9aa2ad; --line:#2a2f37;
  --mine:#5fd38f; --mine-bg:#173326; --free:#7fb0ff; --free-bg:#1a2740;
  --pay:#a3a9b3; --pay-bg:#23272e; --open:#f0a54a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.fml{height:24px;width:auto;flex:none}
h1{font-size:19px;margin:0;font-weight:750;letter-spacing:-.2px}
.tabs{display:flex;gap:4px;max-width:1100px;margin:10px auto 0}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;
  padding:9px 0 11px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--text);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 30px)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  color:var(--text);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.off{opacity:.38}
.chip.all{font-weight:600}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.hero .ttl{font-size:21px;font-weight:750;margin:4px 0 2px}
.cd{display:flex;gap:10px;margin:12px 0 8px}
.cd div{background:var(--bg);border-radius:10px;padding:8px 0;text-align:center;flex:1;max-width:90px}
.cd b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:11px;color:var(--muted)}
.month{font-size:13px;font-weight:750;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:18px 2px 8px}
.ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.ev .bar{width:4px;border-radius:4px;background:var(--c);flex:none}
.ev .when{width:62px;flex:none;text-align:center}
.ev .when .d{font-size:20px;font-weight:750;line-height:1.1}
.ev .when .w{font-size:11px;color:var(--muted);text-transform:uppercase}
.ev .body{flex:1;min-width:0}
.ser{font-size:12px;font-weight:700;color:var(--c2,var(--muted))}
.name{font-weight:650}
.star{color:var(--hl)}
.meta{font-size:13px;color:var(--muted)}
.time{font-size:13px;font-weight:650;margin-top:2px}
.time.tba{color:var(--muted);font-weight:500;font-style:italic}
.tv{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11.5px;border-radius:6px;padding:2px 7px;font-weight:600}
.tag.mine{background:var(--mine-bg);color:var(--mine)}
.tag.free{background:var(--free-bg);color:var(--free)}
.tag.pay{background:var(--pay-bg);color:var(--pay);font-weight:500}
.tag.open{border:1px dashed var(--open);color:var(--open);font-weight:500}
.kind{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:0 5px;margin-left:4px;vertical-align:2px}
.kind.sp{border-color:var(--accent);color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
/* Kalender */
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calnav button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;
  width:40px;height:36px;font-size:18px;cursor:pointer}
.calnav h2{font-size:17px;margin:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid .h{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:700}
.day{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:54px;padding:3px;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day.out{opacity:.35}
.day.today{border-color:var(--accent);border-width:2px}
.day.sel{outline:2px solid var(--text);outline-offset:-2px}
.day .n{font-size:12px;font-weight:650}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.lab{display:none;font-size:10.5px;line-height:1.2;border-left:3px solid var(--c);padding-left:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:760px){
  .day{min-height:96px}.dots{display:none}.lab{display:block}
}
.daylist{margin-top:14px}
/* Serien */
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:6px solid var(--c)}
.sc h3{margin:0 0 4px;font-size:16px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sc.dis{opacity:.5}
.sw{position:relative;width:46px;height:28px;flex:none;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s}
.sw span::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span{background:#d71920}
.sw input:checked+span::before{transform:translateX(18px)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
.ev,.hero{cursor:pointer}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:650;padding:7px 0;border-radius:8px;cursor:pointer}
.seg button.on{background:#d71920;color:#fff}
.tl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}
.tlr{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.tlr:first-child{border-top:0}
.tlr .tm{width:58px;flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.tlr .tm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.tlr .cb{width:4px;border-radius:4px;background:var(--c);flex:none}
.tlr .bd{flex:1;min-width:0}
.tlr.past{opacity:.45}
.tlr.live .tm{color:#d71920}
.ov{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#d71920;border-radius:5px;padding:0 6px;margin-top:4px}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);
  border-radius:18px 18px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 24px);max-width:760px;margin:0 auto}
@media (min-width:760px){#sheet .pn{top:5vh;bottom:auto;border-radius:18px}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sbar{position:sticky;top:-8px;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:flex-end;padding:8px 0 4px;margin-top:-8px}
.sbar .grab{position:absolute;left:50%;transform:translateX(-50%);top:10px;margin:0}
.x{border:0;background:var(--card);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;border:1px solid var(--line)}
.dh{border-left:6px solid var(--c);padding-left:12px;margin:6px 0 14px}
.dh .ttl{font-size:21px;font-weight:750;margin:2px 0}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:750;color:var(--muted);margin:18px 0 8px}
.lnk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;color:var(--text);text-decoration:none}
.lnk .go{margin-left:auto;font-weight:700;color:#d71920;white-space:nowrap}
.lnk .sub{font-size:12px;color:var(--muted)}
.st{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px;margin-bottom:10px}
.st td{padding:5px 8px;border-top:1px solid var(--line)}
.st tr:first-child td{border-top:0}
.st td.p{width:30px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.st td.pt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.st td.tm2{color:var(--muted);font-size:12px}
.cls{font-weight:700;font-size:13px;margin:10px 0 4px}
@media (min-width:760px){ .list2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px} }
</style>
</head>
<body>
<header>
  <div class="top">
    <svg class="fml" viewBox="20 20 478 128" aria-label="FML"><rect x="20" y="20" width="150" height="128" rx="18" fill="#d71920"/><path d="M519.0 -702V-565H233.0V-417H447.0V-284H233.0V0H62.0V-702Z" fill="#FFFFFF" transform="translate(67.30085106382978,119.69999999999999) scale(0.10127659574468084,0.10127659574468084)"/><rect x="184" y="20" width="150" height="128" rx="18" fill="#d71920"/><path d="M857.0 -702V0H686.0V-421L529.0 0H391.0L233.0 -422V0H62.0V-702H264.0L461.0 -216L656.0 -702Z" fill="#FFFFFF" transform="translate(212.5140425531915,119.69999999999999) scale(0.10127659574468084,0.10127659574468084)"/><rect x="348" y="20" width="150" height="128" rx="18" fill="#d71920"/><path d="M233.0 -132H457.0V0H62.0V-702H233.0Z" fill="#FFFFFF" transform="translate(398.8455319148936,119.69999999999999) scale(0.10127659574468084,0.10127659574468084)"/></svg>
    <h1>Rennkalender</h1>
  </div>
  <nav class="tabs" role="tablist">
    <button data-v="next" class="on">Nächste</button>
    <button data-v="wk">Wochenende</button>
    <button data-v="cal">Kalender</button>
    <button data-v="series">Serien</button>
  </nav>
</header>
<main>
  <div class="chips" id="chips"></div>
  <section id="v-next"></section>
  <section id="v-wk" hidden></section>
  <section id="v-cal" hidden></section>
  <section id="v-series" hidden></section>
  <footer id="foot"></footer>
</main>
<div id="sheet"><div class="bg"></div><div class="pn" id="pn"></div></div>

<script>
(function(){
const TZ='Europe/Berlin';
const fmt=(o)=>new Intl.DateTimeFormat('de-DE',Object.assign({timeZone:TZ},o));
const fDayKey=fmt({year:'numeric',month:'2-digit',day:'2-digit'});
const fTime=fmt({hour:'2-digit',minute:'2-digit'});
const fWeek=fmt({weekday:'short'});
const fLong=fmt({weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fMonth=fmt({month:'long',year:'numeric'});
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// "YYYY-MM-DD" key in Berlin time
function keyOf(date){const p=fDayKey.formatToParts(date);const g=t=>p.find(x=>x.type===t).value;return g('year')+'-'+g('month')+'-'+g('day')}
function noonUTC(k){return new Date(k+'T12:00:00Z')}
function addDays(k,n){const d=noonUTC(k);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let DATA=null, SER={}, EVENTS=[];
let hidden=new Set(store.get('rk_hidden',[]));
let showSess=true;
let off=new Set(store.get('rk_off',[]));
let view='next', calMonth=null, selDay=null;

function prep(d){
  DATA=d; SER={}; d.series.forEach(s=>SER[s.id]=s);
  EVENTS=d.events.filter(e=>SER[e.s]).map((e,i)=>{
    const x=Object.assign({},e); x.i=i;
    if(e.start){x.t=new Date(e.start);x.k1=keyOf(x.t);x.k2=x.k1;const h=e.dur||({quali:1,sq:1,sprint:1}[e.type])||2.5;x.end=new Date(x.t.getTime()+h*3600e3)}
    else if(e.date){x.k1=e.date;x.k2=e.date}
    else {x.k1=e.from;x.k2=e.to||e.from}
    if(!x.end){x.end=noonUTC(addDays(x.k2,1))}
    x.sort=x.t?x.t.getTime():noonUTC(x.k1).getTime()-6*3600e3;
    return x;
  }).sort((a,b)=>a.sort-b.sort);
}
const visible=()=>EVENTS.filter(e=>!off.has(e.s)&&!hidden.has(e.s)&&(showSess||!e.type));
const upcoming=()=>{const now=Date.now();return visible().filter(e=>e.end.getTime()>now)};

function tvTags(e){
  const list=e.tv||SER[e.s].tv||[];
  const order={mine:0,free:1,pay:2,open:3};
  return list.slice().sort((a,b)=>order[a.k]-order[b.k]).map(t=>
    `<span class="tag ${esc(t.k)}" title="${esc(t.x||'')}">${esc(t.n)}</span>`).join('');
}
function whenText(e){
  if(e.t) return `<div class="time">${fTime.format(e.t)} Uhr</div>`;
  if(e.k1!==e.k2) return `<div class="time tba">${dm(e.k1)} – ${dm(e.k2)} · Uhrzeit folgt</div>`;
  return `<div class="time tba">Uhrzeit folgt</div>`;
}
function badge(e){
  if(e.type==='quali')return ' <span class="kind">Qualifying</span>';
  if(e.type==='sprint')return ' <span class="kind sp">Sprint</span>';
  if(e.type==='sq')return ' <span class="kind">Sprint-Quali</span>';
  return '';
}
function dm(k){const d=noonUTC(k);return d.getUTCDate()+'.'+(d.getUTCMonth()+1)+'.'}
function evCard(e){
  const s=SER[e.s]; const d=noonUTC(e.k1);
  const place=[e.track,e.country].filter(Boolean).map(esc).join(' · ');
  return `<div class="ev" data-i="${e.i}" style="--c:${s.color}">
    <div class="bar"></div>
    <div class="when"><div class="w">${WD[d.getUTCDay()]}</div><div class="d">${d.getUTCDate()}.</div><div class="w">${MN[d.getUTCMonth()].slice(0,3)}</div></div>
    <div class="body">
      <div class="ser">${esc(s.name)}</div>
      <div class="name">${e.hl?'<span class="star">★</span> ':''}${esc(e.name)}${badge(e)}</div>
      ${place?`<div class="meta">${place}</div>`:''}
      ${whenText(e)}
      <div class="tv">${tvTags(e)}</div>
      ${e.note?`<div class="note">${esc(e.note)}</div>`:''}
    </div></div>`;
}

function renderChips(){
  const all=hidden.size===0;
  let h=`<button class="chip all ${all?'':'off'}" data-s="*">Alle</button>`;
  DATA.series.filter(s=>!off.has(s.id)).forEach(s=>{h+=`<button class="chip ${hidden.has(s.id)?'off':''}" data-s="${s.id}"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</button>`});
  const el=document.getElementById('chips'); el.innerHTML=h;
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const id=b.dataset.s;
    if(id==='#'){showSess=!showSess;store.set('rk_sess',showSess);renderAll();return}
    if(id==='*'){hidden=hidden.size?new Set():new Set(DATA.series.filter(s=>!off.has(s.id)).map(s=>s.id))}
    else if(hidden.has(id))hidden.delete(id); else hidden.add(id);
    store.set('rk_hidden',[...hidden]); renderAll();
  });
}

let timer=null;
function renderNext(){
  const el=document.getElementById('v-next'); const up=upcoming();
  if(!up.length){el.innerHTML='<div class="empty">Keine kommenden Termine für die gewählten Serien.</div>';return}
  const nx=up[0]; const s=SER[nx.s];
  const target=nx.t?nx.t:noonUTC(nx.k1);
  let h=`<div class="hero" data-i="${nx.i}" style="--c:${s.color}">
    <div class="lbl">Als Nächstes · ${esc(s.name)}</div>
    <div class="ttl">${nx.hl?'<span class="star">★</span> ':''}${esc(nx.name)}${badge(nx)}</div>
    <div class="meta">${[nx.track,nx.country].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="time">${nx.t?fLong.format(nx.t)+', '+fTime.format(nx.t)+' Uhr':(nx.k1!==nx.k2?dm(nx.k1)+' – '+dm(nx.k2)+noonUTC(nx.k2).getUTCFullYear()+' · Uhrzeit folgt':fLong.format(noonUTC(nx.k1))+' · Uhrzeit folgt')}</div>
    <div class="cd" id="cd"></div>
    <div class="tv">${tvTags(nx)}</div></div>`;
  let cur='', grp='';
  up.forEach(e=>{const d=noonUTC(e.k1);const m=MN[d.getUTCMonth()]+' '+d.getUTCFullYear();
    if(m!==cur){if(cur)grp+='</div>';grp+=`<div class="month">${m}</div><div class="list2">`;cur=m}
    grp+=evCard(e)});
  el.innerHTML=h+grp+'</div>';
  const tick=()=>{const c=document.getElementById('cd'); if(!c)return;
    let ms=target.getTime()-Date.now();
    if(ms<=0){c.innerHTML=nx.t?'<div><b>LIVE</b><span>läuft</span></div>':'<div><b>Heute</b><span>&nbsp;</span></div>';return}
    const D=Math.floor(ms/864e5),H=Math.floor(ms%864e5/36e5),M=Math.floor(ms%36e5/6e4),S=Math.floor(ms%6e4/1e3);
    c.innerHTML=`<div><b>${D}</b><span>Tage</span></div><div><b>${H}</b><span>Std</span></div><div><b>${M}</b><span>Min</span></div>`+(nx.t?`<div><b>${S}</b><span>Sek</span></div>`:'');};
  clearInterval(timer); tick(); timer=setInterval(tick,1000);
}

function renderCal(){
  const el=document.getElementById('v-cal'); const today=keyOf(new Date());
  if(!calMonth)calMonth=today.slice(0,7);
  const [y,m]=calMonth.split('-').map(Number);
  const first=new Date(Date.UTC(y,m-1,1,12)); const startOff=(first.getUTCDay()+6)%7;
  const gridStart=addDays(first.toISOString().slice(0,10),-startOff);
  const byDay={}; visible().forEach(e=>{let k=e.k1;for(let i=0;i<10;i++){(byDay[k]=byDay[k]||[]).push(e);if(k===e.k2)break;k=addDays(k,1)}});
  let h=`<div class="calnav"><button id="pm" aria-label="Vormonat">‹</button><h2>${MN[m-1]} ${y}</h2><button id="nm" aria-label="Nächster Monat">›</button></div><div class="grid">`;
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(w=>h+=`<div class="h">${w}</div>`);
  for(let i=0;i<42;i++){const k=addDays(gridStart,i);const evs=byDay[k]||[];
    const out=k.slice(0,7)!==calMonth;
    h+=`<div class="day ${out?'out':''} ${k===today?'today':''} ${k===selDay?'sel':''}" data-k="${k}"><div class="n">${Number(k.slice(8))}</div>
      <div class="dots">${evs.slice(0,8).map(e=>`<i style="--c:${SER[e.s].color}"></i>`).join('')}</div>
      ${evs.slice(0,4).map(e=>`<div class="lab" style="--c:${SER[e.s].color}">${e.hl?'★ ':''}${esc(e.name)}</div>`).join('')}
      ${evs.length>4?`<div class="lab" style="--c:transparent">+${evs.length-4} weitere</div>`:''}</div>`;}
  h+='</div><div class="daylist" id="daylist"></div>';
  el.innerHTML=h;
  el.querySelector('#pm').onclick=()=>{calMonth=shiftMonth(calMonth,-1);renderCal()};
  el.querySelector('#nm').onclick=()=>{calMonth=shiftMonth(calMonth,1);renderCal()};
  el.querySelectorAll('.day').forEach(d=>d.onclick=()=>{selDay=d.dataset.k;renderCal()});
  const dl=el.querySelector('#daylist');
  if(selDay){const evs=byDay[selDay]||[];const d=noonUTC(selDay);
    dl.innerHTML=`<div class="month">${fLong.format(d)}</div>`+(evs.length?`<div class="list2">${evs.map(evCard).join('')}</div>`:'<div class="empty">Keine Rennen an diesem Tag.</div>');}
  else{const evs=visible().filter(e=>e.k2.slice(0,7)>=calMonth&&e.k1.slice(0,7)<=calMonth);
    dl.innerHTML=`<div class="month">Alle Termine im ${MN[m-1]}</div>`+(evs.length?`<div class="list2">${evs.map(evCard).join('')}</div>`:'<div class="empty">Keine Rennen in diesem Monat.</div>');}
}
function shiftMonth(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}

function renderSeries(){
  const el=document.getElementById('v-series'); const now=Date.now();
  let h=`<div class="note" style="margin:0 2px 10px">Serien, die dich nicht interessieren, hier ausschalten – sie verschwinden dann überall. Wird pro Gerät gespeichert.</div><div class="legend"><span class="tag mine">deine Sender</span><span class="tag free">kostenlos</span><span class="tag pay">Abo</span><span class="tag open">noch offen</span></div>`;
  DATA.series.forEach(s=>{const evs=EVENTS.filter(e=>e.s===s.id&&e.end.getTime()>now);
    const tv=(s.tv||[]).map(t=>`<div class="note"><span class="tag ${esc(t.k)}">${esc(t.n)}</span> ${esc(t.x||'')}</div>`).join('');
    const on=!off.has(s.id);
    h+=`<div class="sc ${on?'':'dis'}" style="--c:${s.color}"><div class="sh"><h3>${esc(s.name)}</h3>
      <label class="sw"><input type="checkbox" data-sid="${s.id}" ${on?'checked':''}><span></span></label></div>
      <div class="meta">${evs.length?evs.length+' kommende Termine · nächster: '+esc(evs[0].name)+' ('+dm(evs[0].k1)+')':'Keine Termine bekannt – Kalender noch nicht veröffentlicht'}</div>${tv}</div>`});
  el.innerHTML=h;
  el.querySelectorAll('input[data-sid]').forEach(i=>i.onchange=()=>{
    if(i.checked)off.delete(i.dataset.sid); else {off.add(i.dataset.sid);hidden.delete(i.dataset.sid)}
    store.set('rk_off',[...off]); store.set('rk_hidden',[...hidden]); renderAll();
  });
}


// ---------- Links zu Sendern ----------
const LINKS=[
 [/^ORF/i,'https://on.orf.at','ORF ON'],
 [/ServusTV/i,'https://www.servustv.com','ServusTV'],
 [/SRF/i,'https://www.srf.ch/play/tv/live','SRF Play'],
 [/Sportdigital/i,'https://www.sportdigital.de','sportdigital'],
 [/DF1/i,'https://df1.de','DF1'],
 [/ETRC/i,'https://www.youtube.com/@FIAETRC','YouTube'],
 [/24h N[uü]rburgring/i,'https://www.youtube.com/@24hnbr','YouTube'],
 [/GT World/i,'https://www.youtube.com/@GTWorld','YouTube'],
 [/24H Series/i,'https://www.youtube.com/user/24HSeries','YouTube'],
 [/Joyn|ProSieben/i,'https://www.joyn.de','Joyn'],
 [/RTL|Nitro/i,'https://plus.rtl.de','RTL+'],
 [/Disney/i,'https://www.disneyplus.com','Disney+'],
 [/Eurosport|HBO/i,'https://www.hbomax.com','HBO Max'],
 [/Sky|WOW/i,'https://www.sky.de','Sky'],
 [/VideoPass/i,'https://www.worldsbk.com','WorldSBK']
];
function linkFor(t){ if(t.url) return t.url; const m=LINKS.find(l=>l[0].test(t.n)); return m?m[1]:null; }

// ---------- Meisterschaft ----------
let STAND={};
fetch('data/standings.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).then(d=>{STAND=d||{}}).catch(()=>{});
function standHtml(sid){
  const st=STAND[sid]; if(!st||!st.tables||!st.tables.length) return '<div class="note">Noch keine Tabelle hinterlegt – kommt mit dem nächsten Update.</div>';
  let h=`<div class="note">${esc(st.title||'')}${st.asof?' · Stand: '+esc(st.asof):''}</div>`;
  st.tables.forEach(t=>{
    if(t.name) h+=`<div class="cls">${esc(t.name)}${t.top?' · Top '+t.top:''}</div>`;
    h+='<table class="st">'+t.rows.map(r=>`<tr><td class="p">${esc(r[0])}</td><td>${esc(r[1])}${r[2]?`<div class="tm2">${esc(r[2])}</div>`:''}</td><td class="pt">${esc(r[3])}</td></tr>`).join('')+'</table>';
  });
  return h;
}

// ---------- Detailansicht ----------
function openDetail(i){
  const e=EVENTS.find(x=>x.i===i); if(!e) return; const s=SER[e.s];
  const when=e.t?fLong.format(e.t)+', '+fTime.format(e.t)+' Uhr':(e.k1!==e.k2?dm(e.k1)+' – '+dm(e.k2)+noonUTC(e.k2).getUTCFullYear()+' · Uhrzeit folgt':fLong.format(noonUTC(e.k1))+' · Uhrzeit folgt');
  const near=EVENTS.filter(x=>x.s===e.s&&Math.abs(noonUTC(x.k1)-noonUTC(e.k1))<=3*864e5).sort((a,b)=>a.sort-b.sort);
  const tv=(e.tv||s.tv||[]).slice().sort((a,b)=>({mine:0,free:1,pay:2,open:3}[a.k])-({mine:0,free:1,pay:2,open:3}[b.k]));
  let h=`<div class="sbar"><div class="grab"></div><button class="x" aria-label="Schließen">✕</button></div>
   <div class="dh" style="--c:${s.color}"><div class="ser">${esc(s.name)}</div>
   <div class="ttl">${e.hl?'<span class="star">★</span> ':''}${esc(e.name)}${badge(e)}</div>
   <div class="meta">${[e.track,e.country].filter(Boolean).map(esc).join(' · ')}</div>
   <div class="time">${when}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:''}</div>`;
  if(near.length>1){h+='<div class="sec">An diesem Wochenende</div><div class="tl">'+near.map(x=>tlRow(x,x.i===e.i)).join('')+'</div>';}
  h+='<div class="sec">Live sehen</div>'+(tv.length?tv.map(t=>{const u=linkFor(t);
    const inner=`<span class="tag ${esc(t.k)}">${esc(t.n)}</span><span class="sub">${esc(t.x||'')}</span>${u?'<span class="go">Öffnen ›</span>':''}`;
    return u?`<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="lnk">${inner}</div>`}).join(''):'<div class="note">Keine Angabe.</div>');
  h+='<div class="sec">Meisterschaft</div>'+standHtml(e.s);
  const pn=document.getElementById('pn'); pn.innerHTML=h; pn.scrollTop=0;
  document.getElementById('sheet').classList.add('open'); document.body.style.overflow='hidden';
  pn.querySelector('.x').onclick=closeDetail;
}
function closeDetail(){document.getElementById('sheet').classList.remove('open');document.body.style.overflow=''}
document.querySelector('#sheet .bg').onclick=closeDetail;
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeDetail()});
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-i]'); if(!el||ev.target.closest('a')) return;
  openDetail(Number(el.dataset.i));
});

// ---------- Heute / Wochenende ----------
let wkMode=store.get('rk_wk','wk');
function tlRow(e,cur,ovWith){
  const s=SER[e.s]; const now=Date.now();
  const past=e.end.getTime()<now, live=e.t&&e.t.getTime()<=now&&!past;
  const tm=e.t?`${fTime.format(e.t)}<small>${live?'LIVE':'bis '+fTime.format(e.end)}</small>`:`–<small>${e.k1!==e.k2?'ganzes WE':'Zeit folgt'}</small>`;
  return `<div class="tlr ${past?'past':''} ${live?'live':''}" data-i="${e.i}" style="--c:${s.color}${cur?';background:var(--bg)':''}">
    <div class="tm">${tm}</div><div class="cb"></div><div class="bd">
    <div class="ser">${esc(s.name)}</div><div class="name">${e.hl?'<span class="star">★</span> ':''}${esc(e.name)}${badge(e)}</div>
    <div class="tv">${tvTags(e)}</div>${ovWith?`<div class="ov">Überschneidung: ${esc(ovWith)}</div>`:''}</div></div>`;
}
function renderWk(){
  const el=document.getElementById('v-wk'); const today=keyOf(new Date());
  const wd=noonUTC(today).getUTCDay(); let days=[];
  if(wkMode==='today') days=[today];
  else { const start=(wd===5||wd===6||wd===0)?today:addDays(today,(5-wd+7)%7); let k=start; do{days.push(k);k=addDays(k,1)}while(noonUTC(days[days.length-1]).getUTCDay()!==0); }
  let h=`<div class="seg"><button data-m="today" class="${wkMode==='today'?'on':''}">Heute</button><button data-m="wk" class="${wkMode==='wk'?'on':''}">Wochenende</button></div>`;
  const vis=visible(); let any=false;
  days.forEach(k=>{
    const evs=vis.filter(e=>e.k1<=k&&k<=e.k2);
    const timed=evs.filter(e=>e.t).sort((a,b)=>a.t-b.t), rest=evs.filter(e=>!e.t);
    h+=`<div class="month">${fLong.format(noonUTC(k))}</div>`;
    if(!evs.length){h+='<div class="note" style="margin:0 2px 8px">Keine Termine.</div>';return}
    any=true;
    h+='<div class="tl">'+timed.map(e=>{
      const o=timed.filter(x=>x!==e&&x.s!==e.s&&x.t<e.end&&e.t<x.end).map(x=>SER[x.s].name);
      return tlRow(e,false,[...new Set(o)].join(', '));
    }).join('')+rest.map(e=>tlRow(e)).join('')+'</div>';
  });
  el.innerHTML=h;
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{wkMode=b.dataset.m;store.set('rk_wk',wkMode);renderWk()});
}

function renderAll(){
  renderChips();
  if(view==='next')renderNext(); if(view==='cal')renderCal(); if(view==='wk')renderWk(); if(view==='series')renderSeries();
  const u=DATA.updated?noonUTC(DATA.updated):null;
  document.getElementById('foot').innerHTML=`Alle Zeiten in deutscher Zeit · Stand der Daten: ${u?u.getUTCDate()+'.'+(u.getUTCMonth()+1)+'.'+u.getUTCFullYear():'–'}<br>Angaben ohne Gewähr – Zeiten und Sender können sich kurzfristig ändern.`;
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  view=b.dataset.v; document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['next','wk','cal','series'].forEach(v=>document.getElementById('v-'+v).hidden=v!==view);
  renderAll(); window.scrollTo(0,0);
});

fetch('data/races.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{prep(d);renderAll()})
  .catch(()=>{document.getElementById('v-next').innerHTML='<div class="empty">Termine konnten nicht geladen werden.</div>'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
